<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-label="Push notifications arrive on a phone's lock screen, the app badge counts up and a tap opens the app.">
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".07"/></filter></defs>
<style>.bd{animation:bd 9s infinite;transform-box:fill-box;transform-origin:center;}
@keyframes bd{0%,12%{opacity:0;transform:scale(.6)}15%,92%{opacity:1;transform:scale(1)}95%,100%{opacity:0}}
.c0{animation:c0 9s infinite}
@keyframes c0{0%,12%{opacity:0}14%,25%{opacity:1}28%,100%{opacity:0}}
.c1{animation:c1 9s infinite}
@keyframes c1{0%,26%{opacity:0}28%,39%{opacity:1}42%,100%{opacity:0}}
.c2{animation:c2 9s infinite}
@keyframes c2{0%,40%{opacity:0}42%,92%{opacity:1}95%,100%{opacity:0}}
.n0{animation:n0 9s cubic-bezier(.2,.8,.2,1) infinite;}
@keyframes n0{0%,10%{transform:translateY(-40px);opacity:0}14%,50%{transform:translateY(0);opacity:1}54%,100%{transform:translateY(0);opacity:0}}
.n1{animation:n1 9s cubic-bezier(.2,.8,.2,1) infinite;}
@keyframes n1{0%,24%{transform:translateY(-40px);opacity:0}28%,50%{transform:translateY(0);opacity:1}54%,100%{transform:translateY(0);opacity:0}}
.n2{animation:n2 9s cubic-bezier(.2,.8,.2,1) infinite;}
@keyframes n2{0%,38%{transform:translateY(-40px);opacity:0}42%,50%{transform:translateY(0);opacity:1}54%,100%{transform:translateY(0);opacity:0}}
.tap{animation:tap 9s  infinite;transform-box:fill-box;transform-origin:center}
@keyframes tap{0%,44%{transform:scale(.3);opacity:0}46%{transform:scale(.3);opacity:.9}52%,100%{transform:scale(1.5);opacity:0}}
.open{animation:open 9s cubic-bezier(.2,.8,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes open{0%,52%{transform:scale(.6);opacity:0}57%,92%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
.flow{animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.c0,.c1,.tap,.n0,.n1,.n2{opacity:0}}</style>
