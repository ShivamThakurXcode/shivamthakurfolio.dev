<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-label="An AI assistant: a question is typed and sent, the answer streams in and cites the source document.">
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".07"/></filter></defs>
<style>.q{animation:q 9s infinite;}
@keyframes q{0%,20%{opacity:0;transform:translateY(10px)}23%,92%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}
.typing{animation:typing 9s infinite}
@keyframes typing{0%,24%{opacity:0}26%,33%{opacity:1}36%,100%{opacity:0}}
.tbub{animation:tbub 9s infinite}
@keyframes tbub{0%,24%{opacity:0}26%,33%{opacity:1}36%,100%{opacity:0}}
.ans{animation:ans 9s infinite;}
@keyframes ans{0%,35%{opacity:0;transform:translateY(6px)}38%,92%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}
.l0{transform-box:fill-box;transform-origin:0 50%;animation:l0 9s infinite}
@keyframes l0{0%,37%{transform:scaleX(0)}41%,92%{transform:scaleX(1);opacity:1}95%,100%{transform:scaleX(1);opacity:0}}
.l1{transform-box:fill-box;transform-origin:0 50%;animation:l1 9s infinite}
@keyframes l1{0%,41.6%{transform:scaleX(0)}45.6%,92%{transform:scaleX(1);opacity:1}95%,100%{transform:scaleX(1);opacity:0}}
.l2{transform-box:fill-box;transform-origin:0 50%;animation:l2 9s infinite}
@keyframes l2{0%,46.2%{transform:scaleX(0)}50.2%,92%{transform:scaleX(1);opacity:1}95%,100%{transform:scaleX(1);opacity:0}}
.l3{transform-box:fill-box;transform-origin:0 50%;animation:l3 9s infinite}
@keyframes l3{0%,50.8%{transform:scaleX(0)}54.8%,92%{transform:scaleX(1);opacity:1}95%,100%{transform:scaleX(1);opacity:0}}
.l4{transform-box:fill-box;transform-origin:0 50%;animation:l4 9s infinite}
@keyframes l4{0%,55.4%{transform:scaleX(0)}59.4%,92%{transform:scaleX(1);opacity:1}95%,100%{transform:scaleX(1);opacity:0}}
.src{animation:src 9s infinite;}
@keyframes src{0%,64%{opacity:0;transform:translateY(10px)}67%,92%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}
.fast{animation:fast 9s infinite;}
@keyframes fast{0%,68%{opacity:0;transform:translateY(10px)}71%,92%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}
.typed{animation:typed 9s linear infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes typed{0%,4%{transform:scaleX(0);opacity:1}16%,19%{transform:scaleX(1);opacity:1}21%,100%{transform:scaleX(1);opacity:0}}
.ph{animation:ph 9s  infinite;}
@keyframes ph{0%,2%{opacity:1}4%,20%{opacity:0}22%,100%{opacity:1}}
.send{animation:send 9s  infinite;transform-box:fill-box;transform-origin:center}
@keyframes send{0%,17%{transform:scale(1)}19%{transform:scale(.82)}21%,100%{transform:scale(1)}}
.bounce{animation:bounce 1s ease-in-out infinite}.b1{animation-delay:.15s}.b2{animation-delay:.3s}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.typing,.typed{opacity:0}}</style>
<rect width="1672" height="941" fill="#F0F0F0"/>

<g filter="url(#sh)"><rect x="450" y="150" width="772" height="640" rx="32" fill="#FFFFFF" stroke="#E3E3E3" stroke-width="3"/></g>
<circle cx="500" cy="193" r="26" fill="#E3FCEC"/><path transform="translate(500 193) scale(0.85)" d="M0 -16 C2 -5 5 -2 16 0 C5 2 2 5 0 16 C-2 5 -5 2 -16 0 C-5 -2 -2 -5 0 -16Z" fill="#00DE51"/>
<rect x="540" y="178" width="150" height="16" rx="8" fill="#1C1C1C"/><circle cx="546" cy="212" r="5" fill="#00DE51"/><rect x="558" y="207" width="76" height="10" rx="5" fill="#CFCFCF"/>
<circle cx="1140" cy="193" r="5" fill="#BDBDBD"/><circle cx="1156" cy="193" r="5" fill="#BDBDBD"/><circle cx="1172" cy="193" r="5" fill="#BDBDBD"/>
<path d="M450 236 H1222" stroke="#EDEDED" stroke-width="3"/>

<g class="q"><rect x="790" y="268" width="400" height="96" rx="26" fill="#1C1C1C"/><text x="818" y="308" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500" fill="#fff">What is our refund</text><text x="818" y="342" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500" fill="#fff">policy for annual plans?</text></g>

<g class="typing"><circle class="bounce b0" cx="512" cy="424" r="8" fill="#9A9A9A"/><circle class="bounce b1" cx="536" cy="424" r="8" fill="#9A9A9A"/><circle class="bounce b2" cx="560" cy="424" r="8" fill="#9A9A9A"/></g>
<rect class="tbub" x="480" y="394" width="130" height="60" rx="26" fill="#F2F2F2" opacity=".0"/>
<g class="ans"><rect x="480" y="394" width="560" height="216" rx="26" fill="#F2F2F2"/><path transform="translate(514 426) scale(0.65)" d="M0 -16 C2 -5 5 -2 16 0 C5 2 2 5 0 16 C-2 5 -5 2 -16 0 C-5 -2 -2 -5 0 -16Z" fill="#00DE51"/></g>
<rect class="l0" x="544" y="418" width="400" height="13" rx="6.5" fill="#1C1C1C"/><rect class="l1" x="544" y="454" width="420" height="13" rx="6.5" fill="#A8A8A8"/><rect class="l2" x="544" y="490" width="360" height="13" rx="6.5" fill="#A8A8A8"/><rect class="l3" x="544" y="526" width="410" height="13" rx="6.5" fill="#A8A8A8"/><rect class="l4" x="544" y="562" width="250" height="13" rx="6.5" fill="#A8A8A8"/>
<g class="src"><rect x="480" y="628" width="250" height="46" rx="23" fill="#E3FCEC" stroke="#00DE51" stroke-width="3"/>
<path d="M502 640 h16 l7 7 v18 h-23 z" fill="#fff" stroke="#00BF43" stroke-width="3" stroke-linejoin="round"/><text x="536" y="659" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#00BF43">refund-policy.pdf</text></g>
<g class="fast"><text x="1040" y="659" text-anchor="end" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" fill="#6B6B6B">Answered in 1.2s</text></g>

<rect x="480" y="712" width="620" height="54" rx="27" fill="#F2F2F2"/>
<rect class="typed" x="512" y="732" width="300" height="14" rx="7" fill="#9A9A9A"/>
<text class="ph" x="512" y="746" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#BDBDBD">Ask anything…</text>
<g class="send"><circle cx="1150" cy="739" r="30" fill="#00DE51"/><path d="M1150 752 V726 M1139 737 L1150 726 L1161 737" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>