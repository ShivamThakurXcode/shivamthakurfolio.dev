<g class="van">
<rect x="1120" y="600" width="96" height="70" rx="10" fill="#00DE51"/><path d="M1216 618 h26 l20 22 v30 h-46 z" fill="#1C1C1C"/><rect x="1226" y="626" width="18" height="14" rx="3" fill="#9EDDB6"/>
<rect x="1146" y="616" width="44" height="36" rx="5" fill="#fff" opacity=".9"/><path d="M1146 630 h44 M1168 616 v36" stroke="#00BF43" stroke-width="3"/>
