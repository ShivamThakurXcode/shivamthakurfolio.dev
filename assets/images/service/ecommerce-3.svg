<g class="home"><circle cx="1500" cy="556" r="24" fill="#00DE51" stroke="#fff" stroke-width="5"/><path d="M1489.2 556 l7.199999999999999 7.199999999999999 l14.399999999999999 -14.399999999999999" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="dl"><rect x="1330" y="740" width="170" height="46" rx="23" fill="#00DE51"/><text x="1415" y="771" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#fff">Delivered</text></g>
</svg>