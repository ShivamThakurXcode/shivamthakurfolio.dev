<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-label="Secure card payment, then the order is confirmed with a receipt and a delivery van brings the parcel home.">
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".07"/></filter></defs>
<style>.tapcard{animation:tapcard 9s ease infinite;}
@keyframes tapcard{0%,6%{transform:translateY(0)}10%{transform:translateY(-14px)}14%,100%{transform:translateY(0)}}
.lock{animation:lock 9s infinite;transform-box:fill-box;transform-origin:center;}
@keyframes lock{0%,8%{opacity:0;transform:scale(.6)}11%,92%{opacity:1;transform:scale(1)}95%,100%{opacity:0}}
.ok{animation:ok 9s infinite;transform-box:fill-box;transform-origin:center;}
@keyframes ok{0%,20%{opacity:0;transform:scale(.6)}23%,92%{opacity:1;transform:scale(1)}95%,100%{opacity:0}}
.r0{animation:r0 9s infinite;}
@keyframes r0{0%,24%{opacity:0;transform:translateY(10px)}27%,92%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}
.r1{animation:r1 9s infinite;}
@keyframes r1{0%,28%{opacity:0;transform:translateY(10px)}31%,92%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}
.r2{animation:r2 9s infinite;}
@keyframes r2{0%,32%{opacity:0;transform:translateY(10px)}35%,92%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}
.tot{animation:tot 9s infinite;}
@keyframes tot{0%,36%{opacity:0;transform:translateY(10px)}39%,92%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}
.van{animation:van 9s cubic-bezier(.5,0,.3,1) infinite;}
@keyframes van{0%,46%{transform:translateX(0);opacity:1}74%,92%{transform:translateX(150px);opacity:1}95%,100%{transform:translateX(150px);opacity:0}}
.home{animation:home 9s infinite;transform-box:fill-box;transform-origin:center;}
@keyframes home{0%,76%{opacity:0;transform:scale(.6)}79%,92%{opacity:1;transform:scale(1)}95%,100%{opacity:0}}
.dl{animation:dl 9s infinite;}
@keyframes dl{0%,78%{opacity:0;transform:translateY(10px)}81%,92%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}
.flow{animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1672" height="941" fill="#F0F0F0"/>

<path d="M520 420 H640 M1000 420 C1060 420 1060 640 1120 640" stroke="#CFCFCF" stroke-width="4" stroke-dasharray="10 10" fill="none" class="flow"/>
