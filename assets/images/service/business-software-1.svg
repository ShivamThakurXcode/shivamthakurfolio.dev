<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-label="A sales pipeline board: a $24k deal moves from lead through qualified and proposal to won, and the total updates.">
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".07"/></filter></defs>
<style>.tot0{animation:tot0 10s infinite}
@keyframes tot0{0%,0.01%{opacity:0}2.01%,57.41%{opacity:1}60.41%,100%{opacity:0}}
.tot1{animation:tot1 10s infinite}
@keyframes tot1{0%,58.01%{opacity:0}60.01%,92%{opacity:1}95%,100%{opacity:0}}
.won{animation:won 10s infinite}
@keyframes won{0%,58%{opacity:0}60%,92%{opacity:1}95%,100%{opacity:0}}
.deal{animation:deal 10s cubic-bezier(.5,0,.3,1) infinite;}
@keyframes deal{0%,10%{transform:translate(0px,0px) rotate(0deg)}14%{transform:translate(94px,-24px) rotate(4deg)}18%,30%{transform:translate(188px,0px) rotate(0deg)}34%{transform:translate(282px,-80px) rotate(4deg)}38%,50%{transform:translate(376px,-110px) rotate(0deg)}54%{transform:translate(470px,-134px) rotate(4deg)}58%,90%{transform:translate(564px,-110px) rotate(0deg)}93%{transform:translate(564px,-110px) rotate(0deg);opacity:1}94%{transform:translate(564px,-110px) rotate(0deg);opacity:0}95%{transform:translate(0px,0px) rotate(0deg);opacity:0}99%{transform:translate(0px,0px) rotate(0deg);opacity:1}}
.conf{animation:conf 10s infinite;transform-box:fill-box;transform-origin:center;}
@keyframes conf{0%,60%{opacity:0;transform:scale(.6)}63%,90%{opacity:1;transform:scale(1)}93%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tot0,.conf{opacity:0}}</style>
