<style>.lift{animation:lift 9s ease infinite;}
@keyframes lift{0%,24%{transform:translateY(0)}30%,92%{transform:translateY(-16px)}96%,100%{transform:translateY(0)}}
.sel{animation:sel 9s infinite}
@keyframes sel{0%,25%{opacity:0}27%,92%{opacity:1}95%,100%{opacity:0}}
.btn{animation:btn 9s infinite}
@keyframes btn{0%,25%{opacity:0}27%,92%{opacity:1}95%,100%{opacity:0}}
.pro{animation:pro 9s infinite;transform-box:fill-box;transform-origin:center;}
