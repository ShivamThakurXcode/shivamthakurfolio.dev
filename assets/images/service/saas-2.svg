.tap{animation:tap 9s  infinite;transform-box:fill-box;transform-origin:center}
@keyframes tap{0%,24%{transform:scale(.4);opacity:0}25%{transform:scale(.4);opacity:.8}31%,100%{transform:scale(1.6);opacity:0}}
.payin{animation:payin 9s ease infinite;}
@keyframes payin{0%,32%{transform:translateX(70px);opacity:0}38%,92%{transform:translateX(0);opacity:1}96%,100%{transform:translateX(0);opacity:0}}
.paid{animation:paid 9s infinite;}
@keyframes paid{0%,46%{opacity:0;transform:translateY(10px)}49%,92%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tap{opacity:0}}</style>
